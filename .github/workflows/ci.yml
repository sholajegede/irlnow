name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      # --frozen-lockfile fails the build if bun.lock disagrees with
      # package.json, rather than silently resolving something different.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # The build is part of CI because it exercises the Start and nitro
      # plugins, which the other steps never touch.
      - name: Build
        run: bun run build
